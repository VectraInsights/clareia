<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clareia — Teste de API</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .test-container { max-width: 800px; margin: 8rem auto; padding: 2rem; }
        .test-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .test-result {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
        }
        .test-success { background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3); }
        .test-error { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3); }
        .test-loading { background: rgba(124, 108, 248, 0.1); border: 1px solid rgba(124, 108, 248, 0.3); }
        .status-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }
        .status-ok { background: var(--success); }
        .status-fail { background: var(--error); }
        .status-loading { background: var(--warning); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .test-btn {
            padding: 0.6rem 1.2rem;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .test-btn:hover { opacity: 0.9; }
        .test-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">💡</span>
                <span class="logo-text">Clareia</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Voltar</a>
            </div>
        </div>
    </nav>

    <div class="test-container">
        <h1 style="font-family: 'Sora', sans-serif; margin-bottom: 0.5rem;">🧪 Teste de Ligação às APIs</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Verifique se as chaves estão corretas e se as APIs respondem.</p>

        <!-- Groq Test -->
        <div class="test-card">
            <h3><span class="status-dot" id="groq-status"></span> Groq API</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">
                Modelo: <code>openai/gpt-oss-120b</code> — Gratuito e rápido
            </p>
            <button class="test-btn" id="groq-test-btn">Testar Groq</button>
            <div id="groq-result"></div>
        </div>

        <!-- Gemini Test -->
        <div class="test-card">
            <h3><span class="status-dot" id="gemini-status"></span> Gemini API</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">
                Modelo: <code>gemini-2.0-flash</code> — Gratuito e rápido
            </p>
            <button class="test-btn" id="gemini-test-btn">Testar Gemini</button>
            <div id="gemini-result"></div>
        </div>

        <!-- Mistral Test -->
        <div class="test-card">
            <h3><span class="status-dot" id="mistral-status"></span> Mistral API</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">
                Modelo: <code>mistral-large-latest</code>
            </p>
            <button class="test-btn" id="mistral-test-btn">Testar Mistral</button>
            <div id="mistral-result"></div>
        </div>

        <!-- Config Info -->
        <div class="test-card">
            <h3>📋 Configuração Atual</h3>
            <div id="config-info" style="font-family: monospace; font-size: 0.85rem; color: var(--text-secondary); margin-top: 1rem;"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        function updateStatus(dotId, status) {
            const dot = document.getElementById(dotId);
            dot.className = 'status-dot status-' + status;
        }

        function showResult(elementId, type, message) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<div class="test-result test-${type}">${message}</div>`;
        }

        // Show current config
        function showConfig() {
            const config = window.CLAREIA_CONFIG;
            const mask = (k) => k ? k.substring(0, 10) + '...' : '(não configurada)';
            const info = document.getElementById('config-info');
            info.innerHTML = `
                <strong>API Ativa:</strong> ${config.ACTIVE_API}<br>
                <strong>Groq Key:</strong> ${mask(config.GROQ_API_KEY)}<br>
                <strong>Gemini Key:</strong> ${mask(config.GEMINI_API_KEY)}<br>
                <strong>Mistral Key:</strong> ${mask(config.MISTRAL_API_KEY)}<br>
                <strong>Groq Model:</strong> ${config.GROQ_MODEL}<br>
                <strong>Gemini Model:</strong> ${config.GEMINI_MODEL}<br>
                <strong>Mistral Model:</strong> ${config.MISTRAL_MODEL}<br>
            `;
        }

        // Test Groq
        document.getElementById('groq-test-btn').addEventListener('click', async () => {
            const config = window.CLAREIA_CONFIG;
            updateStatus('groq-status', 'loading');
            showResult('groq-result', 'loading', 'Testando ligação...');

            try {
                if (!config.GROQ_API_KEY) {
                    throw new Error('GROQ_API_KEY não configurada no Vercel (Environment Variables).');
                }
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: config.GROQ_MODEL,
                        messages: [{ role: 'user', content: 'Diga olá em uma frase curta.' }],
                        max_tokens: 50
                    })
                });

                const data = await response.json();

                if (response.ok && data.choices) {
                    updateStatus('groq-status', 'ok');
                    showResult('groq-result', 'success', `<strong>✅ Groq funcionando!</strong>\nResposta: "${data.choices[0].message.content}"`);
                } else {
                    throw new Error(`HTTP ${response.status}: ${data.error?.message || 'Resposta inválida'}`);
                }
            } catch (error) {
                updateStatus('groq-status', 'fail');
                showResult('groq-result', 'error', `<strong>❌ Erro:</strong> ${error.message}`);
            }
        });

        // Test Gemini
        document.getElementById('gemini-test-btn').addEventListener('click', async () => {
            const config = window.CLAREIA_CONFIG;
            updateStatus('gemini-status', 'loading');
            showResult('gemini-result', 'loading', 'Testando ligação...');

            try {
                if (!config.GEMINI_API_KEY) {
                    throw new Error('GEMINI_API_KEY não configurada no Vercel (Environment Variables).');
                }
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${config.GEMINI_MODEL}:generateContent?key=${config.GEMINI_API_KEY}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: 'user', content: 'Diga olá em uma frase curta.' }],
                            generationConfig: { maxOutputTokens: 50 }
                        })
                    }
                );

                const data = await response.json();

                if (response.ok && data.candidates) {
                    updateStatus('gemini-status', 'ok');
                    showResult('gemini-result', 'success', `<strong>✅ Gemini funcionando!</strong>\nResposta: "${data.candidates[0].content.parts[0].text}"`);
                } else {
                    throw new Error(`HTTP ${response.status}: ${data.error?.message || 'Resposta inválida'}`);
                }
            } catch (error) {
                updateStatus('gemini-status', 'fail');
                showResult('gemini-result', 'error', `<strong>❌ Erro:</strong> ${error.message}`);
            }
        });

        // Test Mistral
        document.getElementById('mistral-test-btn').addEventListener('click', async () => {
            const config = window.CLAREIA_CONFIG;
            updateStatus('mistral-status', 'loading');
            showResult('mistral-result', 'loading', 'Testando ligação...');

            try {
                if (!config.MISTRAL_API_KEY) {
                    throw new Error('MISTRAL_API_KEY não configurada no Vercel (Environment Variables).');
                }
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.MISTRAL_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: config.MISTRAL_MODEL,
                        messages: [{ role: 'user', content: 'Diga olá em uma frase curta.' }],
                        max_tokens: 50
                    })
                });

                const data = await response.json();

                if (response.ok && data.choices) {
                    updateStatus('mistral-status', 'ok');
                    showResult('mistral-result', 'success', `<strong>✅ Mistral funcionando!</strong>\nResposta: "${data.choices[0].message.content}"`);
                } else {
                    throw new Error(`HTTP ${response.status}: ${data.message || 'Resposta inválida'}`);
                }
            } catch (error) {
                updateStatus('mistral-status', 'fail');
                showResult('mistral-result', 'error', `<strong>❌ Erro:</strong> ${error.message}`);
            }
        });

        showConfig();
    </script>
</body>
</html>
